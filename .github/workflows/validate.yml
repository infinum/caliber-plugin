name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.300

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      - name: Validate the plugin
        run: claude plugin validate --strict plugins/caliber

      - name: Check the release
        run: scripts/check-release.sh

      - name: Shellcheck
        run: shellcheck scripts/check-release.sh plugins/caliber/scripts/agent-post-push.sh
